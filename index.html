<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eder.se</title>
<meta name="description" content="Välkommen till eder.se">
<style>
  :root { --bg:#f7f5f0; --text:#1d1d1f; --muted:#6b6b70; --accent:#2f6f5e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141615; --text:#ecebe7; --muted:#9a9a9f; --accent:#7cc2ab; }
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 16px; text-align:center;
  }
  main { max-width:640px; }
  .mark { width:56px; height:4px; background:var(--accent); border-radius:2px; margin:0 auto 32px; }
  h1 { font-size:clamp(2rem, 6vw, 3.5rem); font-weight:700; letter-spacing:-0.02em; line-height:1.1; }
  h1 span { color:var(--accent); }
  p { margin-top:20px; font-size:1.125rem; color:var(--muted); line-height:1.6; }
  footer { position:fixed; bottom:20px; font-size:.875rem; color:var(--muted); }
  .prime { margin-top:56px; }
  .label { font-size:.75rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .formula {
    margin-top:14px; display:inline-flex; align-items:flex-start;
    font-variant-numeric:tabular-nums; font-weight:300; color:var(--text);
  }
  .base { font-size:clamp(2.5rem, 8vw, 4rem); line-height:1; }
  .minus { font-size:clamp(2.5rem, 8vw, 4rem); line-height:1; margin-left:.25em; }
  .exp {
    display:inline-flex; font-size:clamp(1.1rem, 3.4vw, 1.6rem); line-height:1;
    margin-left:.12em; color:var(--accent); font-weight:500;
  }
  .digit { display:inline-block; height:1em; overflow:hidden; }
  .digit > span {
    display:flex; flex-direction:column;
    transition:transform 1.6s cubic-bezier(.16,1,.3,1);
  }
  .digit > span > span { height:1em; }
  .gap { width:.3em; }
  .meta {
    margin-top:18px; font-size:.875rem; color:var(--muted);
    opacity:0; transition:opacity 1s ease 2.4s;
  }
  .ready .meta { opacity:1; }
  @media (prefers-reduced-motion: reduce) {
    .digit > span, .meta { transition:none; }
  }
</style>
</head>
<body>
  <main>
    <div class="mark"></div>
    <h1>Välkommen till <span>eder.se</span></h1>
    <section class="prime" id="prime" aria-label="Det största kända primtalet är 2 upphöjt till 136 279 841, minus 1">
      <div class="label">Största kända primtalet</div>
      <div class="formula" aria-hidden="true">
        <span class="base">2</span><span class="exp" id="exp"></span><span class="minus">&minus;&nbsp;1</span>
      </div>
      <div class="meta">Mersenneprimtalet M136279841 &middot; 41&nbsp;024&nbsp;320 siffror &middot; upptäckt 2024</div>
    </section>
  </main>
  <footer>&copy; <span id="y">2026</span> eder.se</footer>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    // Exponenten rullar fram siffra för siffra, som en mätartavla.
    (function () {
      var exponent = '136279841';
      var exp = document.getElementById('exp');
      var strips = [];
      exponent.split('').forEach(function (d, i) {
        if (i > 0 && (exponent.length - i) % 3 === 0) {
          var gap = document.createElement('span');
          gap.className = 'gap';
          exp.appendChild(gap);
        }
        var digit = document.createElement('span');
        digit.className = 'digit';
        var strip = document.createElement('span');
        for (var n = 0; n < 20; n++) {
          var cell = document.createElement('span');
          cell.textContent = n % 10;
          strip.appendChild(cell);
        }
        digit.appendChild(strip);
        exp.appendChild(digit);
        strips.push({ el: strip, target: 10 + Number(d), delay: 300 + i * 140 });
      });
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          strips.forEach(function (s) {
            s.el.style.transitionDelay = s.delay + 'ms';
            s.el.style.transform = 'translateY(-' + s.target + 'em)';
          });
          document.getElementById('prime').classList.add('ready');
        });
      });
    })();
  </script>
</body>
</html>

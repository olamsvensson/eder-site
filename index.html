<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eder.se</title>
<meta name="description" content="Välkommen till eder.se">
<style>
  :root { --bg:#f7f5f0; --text:#1d1d1f; --muted:#6b6b70; --accent:#2f6f5e; --d0:#0e2a22; --d9:#9fd4c2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141615; --text:#ecebe7; --muted:#9a9a9f; --accent:#7cc2ab; --d0:#2a5e50; --d9:#e3f5ee; }
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 16px; text-align:center;
  }
  main { max-width:640px; }
  .mark { width:56px; height:4px; background:var(--accent); border-radius:2px; margin:0 auto 32px; }
  h1 { font-size:clamp(2rem, 6vw, 3.5rem); font-weight:700; letter-spacing:-0.02em; line-height:1.1; }
  h1 span { color:var(--accent); }
  p { margin-top:20px; font-size:1.125rem; color:var(--muted); line-height:1.6; }
  .exp {
    display:inline-flex; font-size:clamp(1.25rem, 4.5vw, 2.25rem); line-height:1;
    font-variant-numeric:tabular-nums; font-weight:300; color:var(--accent);
  }
  .digit { display:inline-block; height:1em; overflow:hidden; }
  .digit > span {
    display:flex; flex-direction:column;
    transition:transform 1.6s cubic-bezier(.16,1,.3,1);
  }
  .twins { display:flex; justify-content:center; margin-top:56px; }
  .twins .digit > span { transition-duration:.5s; }
  .twins .gap { display:inline-block; width:.6em; }
  /* Varje siffra får en färg efter sitt värde: 0 mörkast, 9 ljusast. */
  .digit > span > span { height:1em; color:color-mix(in oklab, var(--d9) calc(var(--v) * 100% / 9), var(--d0)); }
  @media (prefers-reduced-motion: reduce) {
    .digit > span { transition:none; }
  }
</style>
</head>
<body>
  <main>
    <div class="mark"></div>
    <h1>Välkommen till <span>eder.se</span></h1>
    <div class="twins" aria-hidden="true">
      <span class="exp" id="twins"></span>
    </div>
  </main>
  <script>
    // Letar efter primtalstvillingar (p och p+2 är båda primtal) och visar det senast hittade paret.
    (function () {
      var box = document.getElementById('twins');
      var strips = [];   // en siffra per plats, eller null för mellanrummet

      function isPrime(n) {
        if (n % 3 === 0) return n === 3;
        for (var f = 5; f * f <= n; f += 6) {
          if (n % f === 0 || n % (f + 2) === 0) return false;
        }
        return true;
      }

      function makeDigit() {
        var digit = document.createElement('span');
        digit.className = 'digit';
        var strip = document.createElement('span');
        for (var n = 0; n < 10; n++) {
          var cell = document.createElement('span');
          cell.textContent = n;
          cell.style.setProperty('--v', n);
          strip.appendChild(cell);
        }
        digit.appendChild(strip);
        return { el: digit, strip: strip };
      }

      function show(text) {
        // Bygg om rutorna bara när antalet siffror ändras, annars rullar siffrorna till nya värden.
        if (strips.length !== text.length) {
          box.textContent = '';
          strips = text.split('').map(function (ch) {
            if (ch === ' ') {
              var gap = document.createElement('span');
              gap.className = 'gap';
              box.appendChild(gap);
              return null;
            }
            var d = makeDigit();
            box.appendChild(d.el);
            return d;
          });
        }
        text.split('').forEach(function (ch, i) {
          if (strips[i]) strips[i].strip.style.transform = 'translateY(-' + ch + 'em)';
        });
      }

      var k = 1;            // kandidater: 6k-1 och 6k+1 (plus specialfallet 3 och 5)
      var found = [3, 5];
      var shownAt = 0;
      show('3 5');

      function search(now) {
        var stop = performance.now() + 6;
        while (performance.now() < stop) {
          for (var i = 0; i < 200; i++, k++) {
            var p = 6 * k - 1;
            if (isPrime(p) && isPrime(p + 2)) found = [p, p + 2];
          }
        }
        if (now - shownAt > 700) {
          show(found[0] + ' ' + found[1]);
          shownAt = now;
        }
        requestAnimationFrame(search);
      }
      setTimeout(function () { requestAnimationFrame(search); }, 300);
    })();
  </script>
</body>
</html>
